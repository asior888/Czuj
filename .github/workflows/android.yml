name: Android
on:
  push:
    branches: [main, 'ci/**']
    paths: ['android/**', 'wersja.json', '.github/workflows/android.yml']
  workflow_dispatch:
# domyślnie tylko odczyt; zapis ma wyłącznie zadanie "publish"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.b.outcome }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # token nie zostaje w .git podczas builda
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Testy + build
        id: b
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Wyniki do przekazania
        if: always()
        run: |
          mkdir -p ../out
          cp build.log ../out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../out/czuj-unsigned.apk 2>/dev/null || true
          cp -r app/build/test-results ../out/tests 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-out
          path: out
          retention-days: 7

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-out
          path: out
      - uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false
          sparse-checkout: android/app
      - name: Podpis (apksigner, bez kodu z builda)
        id: s
        if: needs.build.outputs.outcome == 'success'
        env:
          PASS: ${{ secrets.CZUJ_SIGN_PASS }}
        run: |
          ENC=src/android/app/czuj-release.keystore.enc
          if [ -z "$PASS" ] || [ ! -f "$ENC" ]; then
            echo "::warning::Brak sekretu CZUJ_SIGN_PASS albo klucza (workflow 'Klucz podpisu'): APK niepodpisany, bez wydania"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          K="$RUNNER_TEMP/k.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$K" -pass env:PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$K" --ks-pass env:PASS --ks-key-alias czuj --out out/czuj.apk out/czuj-unsigned.apk
          shred -u "$K"
          "$BT/apksigner" verify --print-certs out/czuj.apk | grep -E "SHA-256" | head -1 | tee out/cert.txt
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Wydanie APK (tylko main, tylko po udanym buildzie i podpisie)
        if: needs.build.outputs.outcome == 'success' && steps.s.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SUM=$(sha256sum out/czuj.apk | cut -d' ' -f1)
          # wersja.json dla aplikacji: plik z repo (minimalna, linki, serwer) + numer tego builda
          jq --argjson n "$GITHUB_RUN_NUMBER" '.najnowsza = $n' src/wersja.json > out/wersja.json
          gh release delete android-latest -R "$REPO" -y --cleanup-tag || true
          gh release create android-latest out/czuj.apk out/wersja.json -R "$REPO" --target "$GITHUB_SHA" \
            --title "Czuj na Androida (najnowszy)" \
            --notes "Build ${GITHUB_SHA::7}, wersja 1.0.${GITHUB_RUN_NUMBER}.
          sha256: ${SUM}
          $(cat out/cert.txt)
          Pobierz czuj.apk na telefon i otwórz, Android zapyta o zgodę na instalację."
      - name: Wynik do gałęzi ci-result
        env:
          OUTCOME: ${{ needs.build.outputs.outcome }}
          SIGNED: ${{ steps.s.outputs.ok }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git checkout -q -b ci-result
          echo "${OUTCOME} ${GITHUB_SHA}" > outcome.txt
          L="$GITHUB_WORKSPACE/out/build.log"
          (grep -E "^e: |error:|What went wrong|FAILED|BUILD SUCCESSFUL|BUILD FAILED" -A3 "$L" | head -300) > errors.txt || true
          tail -80 "$L" > tail.txt 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out/" > apk.txt 2>&1 || true
          sha256sum "$GITHUB_WORKSPACE/out/czuj.apk" >> apk.txt 2>/dev/null || true
          echo "podpis: ${SIGNED:-brak}" >> apk.txt
          cp -r "$GITHUB_WORKSPACE/out/tests" tests 2>/dev/null || true
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "ci result ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-result
