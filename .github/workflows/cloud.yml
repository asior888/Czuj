name: Baza (Firebase)
on:
  schedule:
    - cron: '17 3 * * *'   # codziennie 03:17 UTC: agregacja mapy
  push:
    branches: [main, 'ci/**']
    paths: ['firebase/**', '.github/workflows/cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-test:
    # emulator, bez żadnych sekretów
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testy reguł + agregatora
        run: |
          python3 -m unittest test_aggregate 2>&1 | tee ../agg-test.log
          npm install --no-audit --no-fund --loglevel=error
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-czuj "node test-rules.js" 2>&1 | tee ../rules-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-test
          path: |
            rules-test.log
            agg-test.log

  sync:
    # prawdziwa baza: tylko na main, tylko po udanych testach, tylko z sekretem
    needs: rules-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.a.outputs.summary }}
      deployed: ${{ steps.d.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Biblioteki
        run: pip install -q "google-auth==2.29.0" "requests==2.32.3"
      - name: Wdróż reguły
        id: d
        if: github.event_name != 'schedule'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "::warning::Brak sekretu FIREBASE_SA: pomijam"; exit 0; fi
          python3 firebase/deploy_rules.py
      - name: Agregacja mapy
        id: a
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "summary=brak sekretu FIREBASE_SA" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 firebase/aggregate.py /tmp/summary.txt
          echo "summary=$(cat /tmp/summary.txt)" >> "$GITHUB_OUTPUT"

  report:
    needs: [rules-test, sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rules-test
          path: out
      - name: Wynik do gałęzi cloud-result
        env:
          TESTS: ${{ needs.rules-test.result }}
          SYNC: ${{ needs.sync.result }}
          DEPLOYED: ${{ needs.sync.outputs.deployed }}
          SUMMARY: ${{ needs.sync.outputs.summary }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git checkout -q -b cloud-result
          printf 'testy=%s sync=%s reguly=%s %s\n%s\n' "$TESTS" "$SYNC" "$DEPLOYED" "$GITHUB_SHA" "$SUMMARY" > outcome.txt
          cp "$GITHUB_WORKSPACE"/out/*.log . 2>/dev/null || true
          git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "cloud result ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" cloud-result
